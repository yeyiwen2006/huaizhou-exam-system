name: 任务卡
description: 按 A01-E07 建立可独立验收的开发任务
title: "[任务编号] "
labels: ["task"]
body:
  - type: input
    id: owner
    attributes:
      label: 负责人
    validations:
      required: true
  - type: input
    id: reviewers
    attributes:
      label: 审查人
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与输出
      description: 写明输入、输出和不在本任务范围内的内容。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖
      description: 列出前置任务、契约、样例和环境。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 使用可以实际检查的条件，避免只写“功能正常”。
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 验证记录
      description: 完成时补充环境、输入、预期、实际结果和未执行项。
