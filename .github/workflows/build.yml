name: Windows build and test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore Huaizhou.ExamSystem.sln --locked-mode

      - name: Build
        run: dotnet build Huaizhou.ExamSystem.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Huaizhou.ExamSystem.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**/*.trx"
