name: C05 isolated native verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: exam-ci-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      EXAM_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=exam-ci-${{ github.run_id }};SSL Mode=Disable
    steps:
      - name: Check out the exact reviewed C05 source
        uses: actions/checkout@v4
        with:
          ref: db2bf2b14b774edb07a06d72c9f976e9e37db754
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/packages.win-x64.lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the real XeLaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-fonts-recommended texlive-lang-chinese
          xelatex --version
          kpsewhich ctexart.cls
          kpsewhich FandolSong-Regular.otf
          fc-cache -f
      - name: Restore locked integration dependencies
        run: dotnet restore tests/Integration/Exam.IntegrationTests/Exam.IntegrationTests.csproj --locked-mode
      - name: Build the reviewed integration source
        run: dotnet build tests/Integration/Exam.IntegrationTests/Exam.IntegrationTests.csproj --configuration Release --no-restore
      - name: Real compiler and PostgreSQL import-to-revision regression
        run: |
          python - <<'PY'
          import json, os, re, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'eng/testing')
          import run_checks
          from evidence import NS, read_trx
          original = run_checks.public_trx
          def diagnostic_trx(raw, target, run_id):
              counts, root = read_trx(raw)
              for result in root.findall(f'{{{NS}}}Results/{{{NS}}}UnitTestResult'):
                  if result.get('outcome') != 'Failed':
                      continue
                  error = result.find(f'{{{NS}}}Output/{{{NS}}}ErrorInfo')
                  if error is None:
                      continue
                  message = error.findtext(f'{{{NS}}}Message', default='')[:3500]
                  stack = error.findtext(f'{{{NS}}}StackTrace', default='')[:5000]
                  for setting in os.environ.get('EXAM_TEST_POSTGRES', '').split(';'):
                      if setting.lower().startswith('password='):
                          secret = setting.partition('=')[2]
                          if secret:
                              message = message.replace(secret, '<redacted>')
                              stack = stack.replace(secret, '<redacted>')
                  message = re.sub(r'(?i)(password|token|authorization)\s*[:=]\s*[^\s,;]+', r'\1=<redacted>', message)
                  message = re.sub(r'[A-Za-z0-9+/=]{64,}', '<long-value-redacted>', message)
                  for location in (str(Path.cwd()), tempfile.gettempdir()):
                      message = message.replace(location, '<fixture>')
                      stack = stack.replace(location, '<fixture>')
                  name = result.get('testName', '').partition('(')[0]
                  print('C05_FAILURE_DIAGNOSTIC ' + json.dumps({'test': name, 'message': message, 'stack': stack}, ensure_ascii=False), flush=True)
              return original(raw, target, run_id)
          run_checks.public_trx = diagnostic_trx
          raise SystemExit(run_checks.run(['latex', 'import-e2e'], Path('.artifacts/checks'), 1200))
          PY
      - name: Diagnose the synthetic compiler fixture on failure
        if: failure()
        run: dotnet test tests/Integration/Exam.IntegrationTests/Exam.IntegrationTests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName=Exam.IntegrationTests.Compilation.XeLaTeXRealToolchainTests.CompileAsync_SyntheticQuestionWithCustomCommandsAndImage_Succeeds --logger "console;verbosity=normal"
      - name: Validate exact-source native evidence
        if: always()
        run: python eng/testing/validate_results.py .artifacts/checks/run-report.json
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c05-native-evidence
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .artifacts/checks/run-report.json
            .artifacts/checks/tools.json
            .artifacts/checks/summary.md
            .artifacts/checks/*/result.trx
