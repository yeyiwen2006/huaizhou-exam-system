name: Build formal source

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/**/packages.lock.json
            src/**/packages.win-x64.lock.json
      - name: Restore formal projects with locked dependencies
        run: dotnet restore Huaizhou.ExamSystem.sln --locked-mode
      - name: Build formal programs
        run: dotnet build Huaizhou.ExamSystem.sln --configuration Release --no-restore
